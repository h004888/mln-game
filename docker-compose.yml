
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mln-game-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOST_PIN=${HOST_PIN:-8888}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/questions', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:3001}
    container_name: mln-game-frontend
    restart: unless-stopped
    environment:
      - PORT=3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
